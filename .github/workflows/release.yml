name: Release

on:
  push:
    tags: ['v*.*.*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify version and release gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: npm
      - run: npm ci
      - name: Match tag to repository version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-ecmsi\.[0-9]+$ ]]; then
            echo "Fork release tags must use vMAJOR.MINOR.PATCH-ecmsi.N (received $TAG_NAME)" >&2
            exit 1
          fi
          TAG_VERSION="${TAG_NAME#v}"
          npm run version:check -- "$TAG_VERSION"
      - name: Run release gates
        run: npm run release:check

  verify-windows:
    name: Verify on Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: npm
      - run: npm ci
      - name: Run portable release gates
        run: npm run release:check:windows

  publish-image:
    name: Publish container image
    needs: [verify, verify-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image tags and labels
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # Fork versions carry a prerelease suffix, so only the exact version and `latest`
          # are applied; the floating major and major.minor aliases are skipped by design.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=N-central REST API MCP (ECMSI fork)
            org.opencontainers.image.description=ECMSI hardened fork of the unofficial MCP server for the N-central REST API
            org.opencontainers.image.vendor=ECMSI
            org.opencontainers.image.licenses=MIT
      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

  release:
    name: Publish GitHub Release
    needs: publish-image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
      - name: Build the package tarball
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          TAG_VERSION="${TAG_NAME#v}"
          # Ship the exact dependency tree the release gates ran against; npm reads
          # npm-shrinkwrap.json from the tarball on install.
          npm shrinkwrap
          npm pack --pack-destination dist
          TARBALL="dist/n-central-rest-api-mcp-${TAG_VERSION}.tgz"
          test -f "$TARBALL"
          (cd dist && sha256sum "$(basename "$TARBALL")" > "$(basename "$TARBALL").sha256")
          echo "TARBALL=$TARBALL" >> "$GITHUB_ENV"
      - name: Create versioned release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          IMAGE_DIGEST: ${{ needs.publish-image.outputs.digest }}
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "Published image did not return an immutable sha256 digest" >&2
            exit 1
          fi
          RELEASE_NOTES="Container image: ghcr.io/${GITHUB_REPOSITORY}:${TAG_VERSION}
          Immutable digest: ${IMAGE_DIGEST}
          Package tarball: $(basename "$TARBALL") (checksum in the matching .sha256 asset). Install on any platform with Node 22.9+ using \`npm install -g <tarball>\`."
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "GitHub Release $GITHUB_REF_NAME already exists; leaving it unchanged."
          else
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --title "$GITHUB_REF_NAME" \
              --notes "$RELEASE_NOTES" \
              --generate-notes \
              "$TARBALL" "$TARBALL.sha256"
          fi
